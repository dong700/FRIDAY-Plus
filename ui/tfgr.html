<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active_AI_Plus · TFGR 事件图</title>
<style>
  :root{
    --bg:#e8f1fb;
    --panel:#f9fcff;
    --panel-2:#eef6fe;
    --line:#12395e;
    --line-soft:#9cbad6;
    --text:#0f2333;
    --muted:#466379;
    --faint:#7b93a8;
    --accent:#c9603f;
    --accent-soft:rgba(201,96,63,.14);
    --teal:#2f8f78;
    --blue:#2c5f8f;
    --ok:#2f8f78;
    --warn:#b07a1d;
    --bad:#b2524c;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    background:radial-gradient(1200px 620px at 8% -12%,#f8fcff 0%,var(--bg) 62%),var(--bg);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:#cfe4f8}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#b7cde3;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  .shell{display:flex;height:100vh}

  .rail{
    width:216px;flex:0 0 216px;border-right:1px solid var(--line);
    padding:22px 14px 16px;display:flex;flex-direction:column;gap:6px;
    background:linear-gradient(180deg,#f2f8ff 0%,#dfeafa 100%);
  }
  .brand{padding:0 8px 18px}
  .brand-name{font-size:15px;font-weight:600;letter-spacing:.14em;color:#12293c}
  .brand-sub{font-size:11px;color:#5d778d;letter-spacing:.08em;margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    color:#3f5a70;cursor:pointer;border:1px solid transparent;
    background:none;width:100%;text-align:left;font:inherit;text-decoration:none;
    transition:color .16s ease,background .16s ease,border-color .16s ease;
  }
  .nav-item:hover{color:#0f2333;background:rgba(255,255,255,.72);border-color:rgba(18,57,94,.22)}
  .nav-item[aria-current="true"]{color:#0f2333;background:#fff;border-color:var(--line);box-shadow:0 1px 3px rgba(16,51,80,.1)}
  .nav-item[aria-current="true"] .nav-dot{background:#00c8ec}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:#a9bed3;flex:0 0 6px}
  .nav-label{flex:1}
  .nav-count{font-family:var(--mono);font-size:11px;color:#5d778d}

  .pet{display:flex;justify-content:center;align-items:flex-end;padding:2px 0 8px;position:relative}
  .pet img{width:118px;height:auto;opacity:.98;pointer-events:none;
    filter:drop-shadow(0 10px 16px rgba(20,60,100,.22));animation:float 4s ease-in-out infinite}
  .pet::after{content:"";position:absolute;bottom:4px;left:50%;width:86px;height:16px;transform:translateX(-50%);
    border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,60,100,.18),rgba(20,60,100,0) 70%)}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion:reduce){.pet img{animation:none}}

  .rail-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line)}
  .conn{display:flex;align-items:center;gap:8px;font-size:12px;color:#3f5a70}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}
  .conn[data-live="true"] .conn-dot{background:var(--ok)}
  .rail-meta{font-family:var(--mono);font-size:11px;color:#5d778d;margin-top:6px;word-break:break-all}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  .head{
    padding:18px 28px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:flex-end;gap:16px;
    background:linear-gradient(180deg,#f4f9ff,#e8f1fb);
  }
  .head h1{margin:0;font-size:17px;font-weight:700}
  .head .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

  .btn{
    font:inherit;font-size:12px;color:var(--text);
    background:#fdfeff;border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;cursor:pointer;
    box-shadow:0 1px 0 rgba(16,51,80,.06);
    transition:background .16s ease,box-shadow .16s ease,transform .12s ease;
  }
  .btn:hover{background:#eef6ff;box-shadow:0 2px 6px rgba(16,51,80,.12)}
  .btn:active{transform:translateY(1px)}
  .btn[data-on="true"]{background:#e4f0fc;border-color:#12395e}

  .body{padding:18px 28px 28px;overflow:auto;flex:1;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    box-shadow:0 1px 0 rgba(16,51,80,.05),0 10px 26px rgba(16,51,80,.07)}
  .card + .card{margin-top:12px}
  .card-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}

  .chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1;
    padding:4px 8px;border-radius:999px;border:1px solid var(--line-soft);
    color:var(--muted);background:#f2f8ff;white-space:nowrap;
  }
  .chip[data-tone="accent"]{color:#9b3f22;border-color:rgba(201,96,63,.55);background:var(--accent-soft)}
  .chip[data-tone="ok"]{color:#22695a;border-color:rgba(47,143,120,.5);background:rgba(47,143,120,.12)}
  .chip[data-tone="blue"]{color:#1e4a72;border-color:rgba(44,95,143,.5);background:rgba(44,95,143,.12)}

  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .empty{padding:30px 20px;text-align:center;color:var(--faint);font-size:13px;
    border:1px dashed var(--line-soft);border-radius:12px;background:#f4f9ff}

  .grid{display:grid;gap:12px}
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat-value{font-family:var(--mono);font-size:22px;line-height:1.2}
  .stat-label{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}

  /* ── 图 ── */
  .graph-wrap{position:relative}
  .graph-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .graph-tools .legend{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

  #graph{
    width:100%;height:min(48vh,440px);min-height:320px;display:block;
    border:1px solid var(--line);border-radius:12px;
    background:
      radial-gradient(900px 420px at 30% 0%,#ffffff 0%,#f4f9ff 55%,#eaf3fd 100%);
    cursor:grab;touch-action:none;
  }
  #graph[data-grab="true"]{cursor:grabbing}
  .graph-tip{
    position:absolute;pointer-events:none;z-index:5;
    background:#0f2333;color:#eaf3ff;font-size:12px;line-height:1.5;
    padding:8px 10px;border-radius:8px;max-width:320px;
    box-shadow:0 8px 24px rgba(16,51,80,.28);opacity:0;transform:translateY(4px);
    transition:opacity .12s ease,transform .12s ease;
  }
  .graph-tip[data-on="true"]{opacity:1;transform:none}

  .sel-card{
    margin-top:10px;padding:12px 14px;border-radius:10px;
    background:#f2f8ff;border:1px solid var(--line-soft);font-size:12.5px;
    animation:detailIn .22s ease both;
  }
  @keyframes detailIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .sel-card .t{font-size:14px;font-weight:700;margin-bottom:4px}
  .sel-card .m{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  .summary{
    font-size:12.5px;color:var(--muted);white-space:pre-wrap;line-height:1.75;
    max-height:170px;overflow:auto;
  }

  /* ── 事件列表 ── */
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .filters input{
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;color:var(--text);font:inherit;font-size:12.5px;outline:none;width:240px;
  }
  .filters input:focus{border-color:var(--accent)}
  .ev{
    display:grid;grid-template-columns:74px 96px 1fr;gap:12px;
    padding:10px 0;border-bottom:1px dashed rgba(18,57,94,.16);
  }
  .ev:last-child{border-bottom:none}
  .ev-time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
  .ev-text{font-size:13px;overflow-wrap:anywhere;cursor:pointer}
  .ev-text:hover{color:#0a4a8a}
  .ev-meta{font-size:11.5px;color:var(--faint);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
  .day-sep{font-size:11px;letter-spacing:.1em;color:var(--faint);margin:14px 0 5px}
  .ev-list{max-height:320px;overflow:auto;padding-right:4px}
</style>
</head>

  <div class="main">
    <div class="head">

      <div class="head-actions">

      <div class="grid grid-3" id="tfgr-stats"></div>

      <div class="card" style="margin-top:12px">
        <p class="card-title">事件关系图（拖动节点 · 滚轮缩放 · 点节点聚焦）</p>

        <div class="filters">
          <input id="tfgr-q" placeholder="按文字 / 实体过滤…">
          <span class="chip" id="tfgr-kind-chip" data-tone="accent" style="cursor:pointer">全部类型</span>
          <span class="faint" style="font-size:11.5px">只显示最近 24 小时 · 每 5 秒刷新</span>
        </div>
        <div class="ev-list" id="tfgr-events"></div>
      </div>
    </div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const pad = (n) => String(n).padStart(2, '0');
  const fmtTime = (sec) => {
    if (!sec) return '—';
    const d = new Date(sec * 1000);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  const fmtDay = (sec) => {
    const d = new Date(sec * 1000);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  };
  const safe = (v) => (v === null || v === undefined || v === '' ? '—' : String(v));

  const state = { tfgr: null, kind: null, q: '', sel: null };

  // ── 图 ──
  const G = {
    nodes: [],
    links: [],
    k: 1, tx: 0, ty: 0,
    alpha: 1,
    paused: false,
    raf: 0,
    dragNode: null,
    panning: null,
    hover: null,
    w: 0, h: 0,
  };
  // 节点位置缓存：刷新数据时不重新随机撒点，图才不会每 5 秒飘一次
  const posCache = new Map();
  let viewReady = false;

  const COLOR = {
    thought: '#c9603f',
    activity: '#2c5f8f',
    silent: '#8a9aab',
    other: '#5f7d99',
  };

  function kindColor(kind) {
    if (/belief|intent|pattern|story|thought|反思|想法/.test(kind)) return COLOR.thought;
    if (/activity|switch|video|screen/.test(kind)) return COLOR.activity;
    if (/silent|idle/.test(kind)) return COLOR.silent;
    return COLOR.other;
  }

  async function loadTfgr() {
    try {
      const r = await fetch('/api/tfgr?limit=200&window_s=86400');
      const j = await r.json();
      if (!j || j.error) {
        $('#conn').dataset.live = 'false';
        $('#conn-text').textContent = '他没起';
        if (!state.tfgr) {
          $('#tfgr-summary').textContent = (j && j.error) || '他没起';
        }
        return;
      }
      state.tfgr = j;
      $('#conn').dataset.live = 'true';
      $('#conn-text').textContent = '已连接';
      $('#conn-detail').textContent = location.host;
      renderStats();
      renderGraph();
      renderSummary();
      renderList();
    } catch (e) {
      $('#conn').dataset.live = 'false';
      $('#conn-text').textContent = '他没起';
    }
  }

  function eventsInView() {
    const list = (state.tfgr && state.tfgr.events) || [];
    const q = state.q.trim().toLowerCase();
    return list.filter(e => {
      if (state.kind && e.kind !== state.kind) return false;
      if (!q) return true;
      const hay = `${e.text || ''} ${(e.entities || []).join(' ')} ${e.kind || ''} ${e.source || ''}`.toLowerCase();
      return hay.includes(q);
    }).slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  }

  function renderStats() {
    const t = state.tfgr;
    const box = $('#tfgr-stats');
    box.innerHTML = '';
    if (!t || t.error) {
      box.appendChild(el('div', 'empty', (t && t.error) || '他没起'));
      $('#tfgr-total').textContent = '—';
      return;
    }
    const evList = t.events || [];
    const kinds = new Set(evList.map(e => e.kind).filter(Boolean));
    $('#tfgr-total').textContent = `${evList.length} 条 / 24h`;
    for (const [label, value] of [
      ['已存事件', safe((t.stats || {}).events)],
      ['最近 24 小时', evList.length],
      ['事件类型', kinds.size],
    ]) {
      const card = el('div', 'card');
      card.appendChild(el('div', 'stat-value', safe(value)));
      card.appendChild(el('div', 'stat-label', label));
      box.appendChild(card);
    }
    $('#nav-tfgr-count').textContent = evList.length || '';
  }

  function renderSummary() {
    const t = state.tfgr;
    $('#tfgr-summary').textContent = (t && t.summary) || '（无摘要）';
  }

  // 构图：后端有 edges 就用，没有就按时序 + 同实体补
  function buildGraph(events) {
    resizeCanvas();
    const limit = 60;
    const list = events.slice(0, limit).slice().reverse(); // 时间正序
    const W = Math.max(300, $('#graph').clientWidth || 800);
    const H = Math.max(260, $('#graph').clientHeight || 400);

    // 按事件类型分成簇，围着中心摆一圈；同类事件聚成一团，跨类的时序连线把它们连成网
    const kinds = [...new Set(list.map(e => e.kind || 'event'))].slice(0, 8);
    const CX = W / 2, CY = H / 2;
    const R = Math.min(W, H) * 0.42;
    const centers = kinds.map((k, i) => {
      const ang = (i / Math.max(1, kinds.length)) * Math.PI * 2 - Math.PI / 2;
      return { kind: k, x: CX + Math.cos(ang) * R, y: CY + Math.sin(ang) * R };
    });

    const nodes = list.map((e, i) => {
      const c = centers[kinds.indexOf(e.kind || 'event')] || { x: CX, y: CY };
      const cached = posCache.get(e.id);
      // 新节点用黄金角在簇心附近错开：可复现，不用 Math.random，
      // 否则每次刷新位置都变，看起来就像果冻一样抖。
      const ang = (i * 2.399963) % (Math.PI * 2);
      const rad = 10 + (i % 6) * 6;
      return {
        id: e.id,
        e,
        x: cached ? cached.x : c.x + Math.cos(ang) * rad,
        y: cached ? cached.y : c.y + Math.sin(ang) * rad,
        cx: c.x, cy: c.y,
        vx: 0, vy: 0,
        r: 6.5 + Math.min(9, (Number(e.confidence) || 0.5) * 9),
      };
    });
    G.centers = centers;

    const links = [];
    const realEdges = (state.tfgr && state.tfgr.edges) || [];
    const ids = new Set(nodes.map(n => n.id));
    for (const e of realEdges) {
      if (ids.has(e.src) && ids.has(e.dst)) {
        links.push({ s: e.src, t: e.dst, rel: e.rel || 'edge' });
      }
    }
    // 兜底：时序相邻
    for (let i = 1; i < nodes.length; i++) {
      links.push({ s: nodes[i - 1].id, t: nodes[i].id, rel: 'next' });
    }
    // 同实体
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < Math.min(nodes.length, i + 14); j++) {
        const b = nodes[j];
        const ea = new Set(a.e.entities || []);
        const hit = (b.e.entities || []).some(x => ea.has(x));
        if (hit) links.push({ s: a.id, t: b.id, rel: 'same_entity' });
      }
    }

    G.nodes = nodes;
    G.links = links;
    // 布局一次算到位并冻结：不再让物理模拟一直在后台漂
    prewarm(150);
    if (!viewReady) {
      G.k = 1; G.tx = 0; G.ty = 0;
      viewReady = true;
    }
    // 立刻重绘一帧：不然 canvas 在 resize 后要等到下一个 rAF 才画，中间会闪一下空白
    draw();
    if (!G.raf) loop();
  }

  // 同步跑完力导向，结束就把速度清零 → 首帧就是稳定布局
  function prewarm(iter) {
    for (let i = 0; i < iter; i++) {
      G.alpha = Math.max(0.02, 1 - i / iter);
      stepPhysics();
    }
    G.alpha = 0;
    for (const n of G.nodes) {
      n.vx = 0; n.vy = 0;
      posCache.set(n.id, { x: n.x, y: n.y });
    }
  }

  function stepPhysics() {
    const W = G.w, H = G.h;
    const nodes = G.nodes;
    // 斥力
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = 0.6; dy = 0.4; d2 = 1; }
        const d = Math.sqrt(d2);
        const f = (1700 / d2) * G.alpha;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f;
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      }
    }
    // 连线弹簧
    const map = new Map(nodes.map(n => [n.id, n]));
    for (const l of G.links) {
      const a = map.get(l.s), b = map.get(l.t);
      if (!a || !b) continue;
      const rest = l.rel === 'next' ? 32 : 52;
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      const f = ((d - rest) / d) * 0.045 * G.alpha;
      a.vx += dx * f; a.vy += dy * f;
      b.vx -= dx * f; b.vy -= dy * f;
    }
    // 向心 + 阻尼
    for (const n of nodes) {
      n.vx += ((n.cx ?? W / 2) - n.x) * 0.022 * G.alpha;
      n.vy += ((n.cy ?? H / 2) - n.y) * 0.026 * G.alpha;
      if (n === G.dragNode) continue;
      n.x += n.vx; n.y += n.vy;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x = Math.max(24, Math.min(W - 24, n.x));
      n.y = Math.max(24, Math.min(H - 24, n.y));
    }
  }

  function resizeCanvas() {
    const c = $('#graph');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = c.clientWidth, h = c.clientHeight;
    if (G.w === w && G.h === h) return;
    G.w = w; G.h = h;
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function neighbors(id) {
    const out = new Set([id]);
    for (const l of G.links) {
      if (l.s === id) out.add(l.t);
      if (l.t === id) out.add(l.s);
    }
    return out;
  }

  function tick() {
    resizeCanvas();
    // 只有被拖动/重新布局（alpha>0）时才跑物理；稳定后只重绘，不再自己乱漂
    if (!G.paused && (G.alpha > 0 || G.dragNode)) {
      stepPhysics();
      if (G.alpha > 0) {
        G.alpha *= 0.985;
        if (G.alpha < 0.002) G.alpha = 0;
      }
    }
    draw();
    G.raf = requestAnimationFrame(tick);
  }

  function loop() {
    if (!G.raf) G.raf = requestAnimationFrame(tick);
  }

  function draw() {
    const c = $('#graph');
    const ctx = c.getContext('2d');
    const W = G.w, H = G.h;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(G.tx, G.ty);
    ctx.scale(G.k, G.k);

    const map = new Map(G.nodes.map(n => [n.id, n]));
    const ego = state.sel ? neighbors(state.sel) : null;

    // 边
    for (const l of G.links) {
      const a = map.get(l.s), b = map.get(l.t);
      if (!a || !b) continue;
      const on = ego ? (ego.has(l.s) && ego.has(l.t)) : false;
      // 贝塞尔曲线，比直线更像关系网
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const nx = -(b.y - a.y), ny = (b.x - a.x);
      const curl = 0.16;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(mx + nx * curl, my + ny * curl, b.x, b.y);
      if (ego) {
        ctx.strokeStyle = on ? (l.rel === 'same_entity' ? 'rgba(201,96,63,.75)' : 'rgba(44,95,143,.7)') : 'rgba(18,57,94,.06)';
        ctx.lineWidth = on ? 1.8 : 1;
      } else {
        ctx.strokeStyle = l.rel === 'same_entity' ? 'rgba(201,96,63,.5)' : 'rgba(44,95,143,.34)';
        ctx.lineWidth = 1.2;
      }
      ctx.stroke();
    }

    // 簇标签
    if (G.centers) {
      ctx.font = '10.5px -apple-system,"Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      const CX = W / 2, CY = H / 2;
      for (const c of G.centers) {
        if (!c) continue;
        let dx = c.x - CX, dy = c.y - CY;
        const d = Math.max(1, Math.hypot(dx, dy));
        const lx = c.x + (dx / d) * 26;
        const ly = c.y + (dy / d) * 26;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.strokeText(c.kind, lx, ly);
        ctx.fillStyle = 'rgba(56,86,110,.9)';
        ctx.fillText(c.kind, lx, ly);
      }
      ctx.textAlign = 'left';
    }

    // 节点
    for (const n of G.nodes) {
      const isSel = state.sel === n.id;
      const isNb = ego ? ego.has(n.id) : true;
      const isHover = G.hover === n.id;
      const col = kindColor(n.e.kind || '');
      ctx.globalAlpha = (ego && !isNb) ? 0.22 : 1;

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + (isSel ? 3 : 0), 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.lineWidth = isSel ? 2.4 : 1.6;
      ctx.strokeStyle = isSel ? '#0b2740' : (isHover ? '#0b2740' : 'rgba(255,255,255,.92)');
      ctx.stroke();

      if (isSel || isHover || G.k > 1.6) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#12395e';
        ctx.font = '10px ui-monospace,Consolas,monospace';
        const label = (n.e.kind || '').slice(0, 10);
        ctx.fillText(label, n.x + n.r + 4, n.y + 3);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function nodeAt(sx, sy) {
    for (let i = G.nodes.length - 1; i >= 0; i--) {
      const n = G.nodes[i];
      const x = n.x * G.k + G.tx, y = n.y * G.k + G.ty;
      const dx = sx - x, dy = sy - y;
      if (dx * dx + dy * dy <= (n.r * G.k + 8) ** 2) return n;
    }
    return null;
  }

  function localPoint(ev) {
    const r = $('#graph').getBoundingClientRect();
    return [ev.clientX - r.left, ev.clientY - r.top];
  }

  function showTip(n, ev) {
    const tip = $('#tip');
    const r = $('#graph').getBoundingClientRect();
    tip.textContent = `${fmtTime(n.e.ts)} · ${n.e.kind || ''}\n${n.e.text || ''}`;
    tip.style.left = `${ev.clientX - r.left + 14}px`;
    tip.style.top = `${ev.clientY - r.top + 12}px`;
    tip.dataset.on = 'true';
  }
  function hideTip() { $('#tip').dataset.on = 'false'; }

  // ── 事件绑定 ──
  const cv = $('#graph');
  cv.addEventListener('mousedown', (ev) => {
    const [x, y] = localPoint(ev);
    const n = nodeAt(x, y);
    if (n) {
      G.dragNode = n;
      G.alpha = Math.max(G.alpha, 0.4);
      G.dragMoved = 0;
    } else {
      G.panning = { x: ev.clientX, y: ev.clientY, tx: G.tx, ty: G.ty };
      cv.dataset.grab = 'true';
    }
  });
  window.addEventListener('mousemove', (ev) => {
    if (G.dragNode) {
      const [x, y] = localPoint(ev);
      G.dragNode.x = (x - G.tx) / G.k;
      G.dragNode.y = (y - G.ty) / G.k;
      G.dragMoved += 1;
      G.alpha = Math.max(G.alpha, 0.3);
      hideTip();
      return;
    }
    if (G.panning) {
      G.tx = G.panning.tx + (ev.clientX - G.panning.x);
      G.ty = G.panning.ty + (ev.clientY - G.panning.y);
      return;
    }
    const [x, y] = localPoint(ev);
    if (x < 0 || y < 0 || x > G.w || y > G.h) { hideTip(); G.hover = null; return; }
    const n = nodeAt(x, y);
    G.hover = n ? n.id : null;
    if (n) showTip(n, ev); else hideTip();
  });
  window.addEventListener('mouseup', () => {
    if (G.dragNode) {
      if (G.dragMoved <= 2) {
        state.sel = (state.sel === G.dragNode.id) ? null : G.dragNode.id;
        renderSelCard();
      }
      G.dragNode = null;
    }
    G.panning = null;
    cv.dataset.grab = 'false';
  });
  cv.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const [x, y] = localPoint(ev);
    const oldK = G.k;
    const k = Math.min(3.2, Math.max(0.45, oldK * (ev.deltaY > 0 ? 0.88 : 1.14)));
    G.tx = x - (x - G.tx) * (k / oldK);
    G.ty = y - (y - G.ty) * (k / oldK);
    G.k = k;
  }, { passive: false });

  function renderSelCard() {
    const box = $('#sel-card');
    box.innerHTML = '';
    if (!state.sel) return;
    const n = G.nodes.find(x => x.id === state.sel);
    if (!n) return;
    const card = el('div', 'sel-card');
    card.appendChild(el('div', 't', n.e.text || '（空）'));
    card.appendChild(el('div', 'm', `${fmtTime(n.e.ts)} · ${n.e.kind || ''} · 来源 ${n.e.source || '—'} · 置信 ${Math.round((n.e.confidence || 0) * 100)}%`));
    if (n.e.entities && n.e.entities.length) {
      const m = el('div');
      m.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';
      for (const x of n.e.entities.slice(0, 8)) m.appendChild(el('span', 'chip', x));
      card.appendChild(m);
    }
    box.appendChild(card);
  }

  function renderList() {
    const box = $('#tfgr-events');
    box.innerHTML = '';
    const list = eventsInView();
    if (!list.length) {
      box.appendChild(el('div', 'empty', state.q || state.kind ? '没有匹配的事件' : '这一天还没有事件'));
      return;
    }
    let lastDay = '';
    for (const e of list) {
      const day = fmtDay(e.ts);
      if (day !== lastDay) {
        lastDay = day;
        box.appendChild(el('div', 'day-sep', day));
      }
      const row = el('div', 'ev');
      row.appendChild(el('div', 'ev-time', fmtTime(e.ts)));
      const kind = el('div');
      const chip = el('span', 'chip', e.kind || 'event');
      const tone = /activity|video|work/.test(e.kind || '') ? 'blue' : /speak|chat|user|dialog|intent|belief/.test(e.kind || '') ? 'accent' : '';
      if (tone) chip.dataset.tone = tone;
      chip.style.cursor = 'pointer';
      chip.addEventListener('click', () => {
        state.kind = state.kind === e.kind ? null : e.kind;
        $('#tfgr-kind-chip').textContent = state.kind || '全部类型';
        renderAll();
      });
      kind.appendChild(chip);
      row.appendChild(kind);

      const main = el('div');
      const text = el('div', 'ev-text', e.text || '（空）');
      text.addEventListener('click', () => {
        state.sel = e.id;
        renderSelCard();
        if (!G.nodes.find(n => n.id === e.id)) return;
        $('#graph').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      main.appendChild(text);
      const meta = el('div', 'ev-meta');
      if (e.source) meta.appendChild(el('span', '', `来源 ${e.source}`));
      if (e.end_ts) meta.appendChild(el('span', 'mono', `→ ${fmtTime(e.end_ts)}`));
      if (e.confidence !== undefined) meta.appendChild(el('span', 'mono', `置信 ${Math.round((e.confidence || 0) * 100)}%`));
      if (Number(e.rev) > 0) {
        const badge = el('span', 'chip', `改过 ${e.rev} 次`);
        badge.dataset.tone = 'accent';
        meta.appendChild(badge);
      }
      if (e.entities && e.entities.length) {
        for (const ent of e.entities.slice(0, 5)) meta.appendChild(el('span', 'chip', ent));
      }
      main.appendChild(meta);
      row.appendChild(main);
      box.appendChild(row);
    }
  }

  function renderGraph() {
    if (!state.tfgr || state.tfgr.error) {
      G.nodes = []; G.links = [];
      const ctx = $('#graph').getContext('2d');
      ctx.clearRect(0, 0, $('#graph').clientWidth, $('#graph').clientHeight);
      return;
    }
    const view = eventsInView();
    buildGraph(view);
    $('#graph-info').textContent = `${G.nodes.length} 节点 · ${G.links.length} 边`;
  }

  function renderAll() {
    renderStats();
    renderGraph();
    renderSummary();
    renderList();
  }

  $('#btn-tfgr-refresh').addEventListener('click', loadTfgr);
  $('#tfgr-q').addEventListener('input', (e) => { state.q = e.target.value; renderAll(); });
  $('#btn-relayout').addEventListener('click', () => {
    state.sel = null;
    posCache.clear();
    renderSelCard();
    renderGraph();
  });
  $('#btn-fitgraph').addEventListener('click', () => {
    G.k = 1; G.tx = 0; G.ty = 0;
  });
  $('#btn-pause').addEventListener('click', (e) => {
    G.paused = !G.paused;
    e.target.dataset.on = String(G.paused);
    e.target.textContent = G.paused ? '继续' : '暂停';
  });
  window.addEventListener('resize', () => { G.w = 0; });

  loadTfgr();
  setInterval(loadTfgr, 5000);
})();
</script>
</body>
</html>
