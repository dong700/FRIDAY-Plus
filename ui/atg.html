<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active_AI_Plus · ATG 活动时序</title>
<style>
  :root{
    --bg:#e8f1fb;
    --panel:#f9fcff;
    --panel-2:#eef6fe;
    --line:#12395e;
    --line-strong:#0b2740;
    --text:#0f2333;
    --muted:#466379;
    --faint:#7b93a8;
    --accent:#c9603f;
    --accent-soft:rgba(201,96,63,.14);
    --teal:#2f8f78;
    --blue:#2c5f8f;
    --ok:#2f8f78;
    --warn:#b07a1d;
    --bad:#b2524c;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    background:radial-gradient(1200px 620px at 8% -12%,#f8fcff 0%,var(--bg) 62%),var(--bg);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:#cfe4f8}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#b7cde3;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  .shell{display:flex;height:100vh}

  .rail{
    width:216px;flex:0 0 216px;border-right:1px solid var(--line);
    padding:22px 14px 16px;display:flex;flex-direction:column;gap:6px;
    background:linear-gradient(180deg,#f2f8ff 0%,#dfeafa 100%);
  }
  .brand{padding:0 8px 18px}
  .brand-name{font-size:15px;font-weight:600;letter-spacing:.14em;color:#12293c}
  .brand-sub{font-size:11px;color:#5d778d;letter-spacing:.08em;margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    color:#3f5a70;cursor:pointer;border:1px solid transparent;
    background:none;width:100%;text-align:left;font:inherit;text-decoration:none;
    transition:color .16s ease,background .16s ease,border-color .16s ease;
  }
  .nav-item:hover{color:#0f2333;background:rgba(255,255,255,.72);border-color:rgba(18,57,94,.22)}
  .nav-item[aria-current="true"]{
    color:#0f2333;background:#fff;border-color:var(--line);
    box-shadow:0 1px 3px rgba(16,51,80,.1);
  }
  .nav-item[aria-current="true"] .nav-dot{background:#00c8ec}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:#a9bed3;flex:0 0 6px}
  .nav-label{flex:1}
  .nav-count{font-family:var(--mono);font-size:11px;color:#5d778d}

  .pet{display:flex;justify-content:center;align-items:flex-end;padding:2px 0 8px;position:relative}
  .pet img{width:118px;height:auto;opacity:.98;pointer-events:none;filter:drop-shadow(0 10px 16px rgba(20,60,100,.22));animation:float 4s ease-in-out infinite}
  .pet::after{content:"";position:absolute;bottom:4px;left:50%;width:86px;height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,60,100,.18),rgba(20,60,100,0) 70%)}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion:reduce){.pet img{animation:none}}

  .rail-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line)}
  .conn{display:flex;align-items:center;gap:8px;font-size:12px;color:#3f5a70}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}
  .conn[data-live="true"] .conn-dot{background:var(--ok)}
  .rail-meta{font-family:var(--mono);font-size:11px;color:#5d778d;margin-top:6px;word-break:break-all}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  .head{
    padding:18px 28px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:flex-end;gap:16px;
    background:linear-gradient(180deg,#f4f9ff,#e8f1fb);
  }
  .head h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
  .head .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

  .btn{
    font:inherit;font-size:12px;color:var(--text);
    background:#fdfeff;border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;cursor:pointer;
    box-shadow:0 1px 0 rgba(16,51,80,.06);
    transition:background .16s ease,box-shadow .16s ease,transform .12s ease;
  }
  .btn:hover{background:#eef6ff;box-shadow:0 2px 6px rgba(16,51,80,.12)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn[data-on="true"]{background:#e4f0fc;border-color:#12395e}

  .body{padding:18px 28px 28px;overflow:auto;flex:1;min-height:0}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    box-shadow:0 1px 0 rgba(16,51,80,.05),0 10px 26px rgba(16,51,80,.07);
  }
  .card + .card{margin-top:12px}
  .card-title{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px;font-weight:700;
  }

  .chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1;
    padding:4px 8px;border-radius:999px;border:1px solid var(--line-soft);
    color:var(--muted);background:#f2f8ff;white-space:nowrap;
  }
  .chip[data-tone="accent"]{color:#9b3f22;border-color:rgba(201,96,63,.55);background:var(--accent-soft)}

  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .empty{
    padding:30px 20px;text-align:center;color:var(--faint);font-size:13px;
    border:1px dashed var(--line-soft);border-radius:12px;background:#f4f9ff;
  }

  /* ── 当前活动 ── */
  .current-activity{
    display:flex;align-items:flex-start;gap:16px;padding:16px 20px;border-radius:12px;
    background:linear-gradient(135deg,rgba(201,96,63,.14),rgba(201,96,63,0) 62%),var(--panel);
    border:1px solid var(--line);
    box-shadow:0 1px 0 rgba(16,51,80,.05),0 10px 26px rgba(16,51,80,.07);
  }
  .current-activity .desc{font-size:19px;font-weight:700;line-height:1.35}
  .current-activity .meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}

  /* ── 时间线 ── */
  .tl-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tl-bar .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fdfeff}
  .tl-bar .seg button{
    font:inherit;font-size:12px;color:var(--muted);background:transparent;border:0;
    padding:6px 10px;cursor:pointer;border-right:1px solid var(--line-soft);
  }
  .tl-bar .seg button:last-child{border-right:0}
  .tl-bar .seg button[data-on="true"]{background:#e4f0fc;color:#12395e;font-weight:600}
  .tl-bar .zoom{display:flex;gap:6px}
  .tl-bar .hint{font-size:11.5px;color:var(--faint)}

  .tl-root{
    position:relative;display:flex;border:1px solid var(--line);border-radius:12px;
    overflow:hidden;background:#fff;user-select:none;
  }
  .tl-labels{
    width:92px;flex:0 0 92px;border-right:1px solid var(--line);
    background:linear-gradient(180deg,#f5faff,#eaf3fc);
  }
  .tl-label-ruler{height:28px;border-bottom:1px solid var(--line)}
  .tl-lane-label{
    height:36px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:9px;font-size:11px;color:var(--muted);
    border-bottom:1px dashed rgba(18,57,94,.18);
    overflow:hidden;white-space:nowrap;
  }
  .tl-view{position:relative;flex:1;min-width:0;overflow:hidden;cursor:grab}
  .tl-view[data-grab="true"]{cursor:grabbing}
  .tl-ruler{
    position:relative;height:28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fbfdff,#f2f8fe);
  }
  .tl-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(18,57,94,.1)}
  .tl-tick-label{
    position:absolute;top:6px;font-family:var(--mono);font-size:10.5px;color:#4d6c84;
    padding-left:5px;white-space:nowrap;
  }
  .tl-density{position:relative;height:12px;border-bottom:1px solid var(--line);background:#f7fbff;overflow:hidden}
  .tl-density i{position:absolute;top:0;bottom:0;background:#2c5f8f;border-radius:1px;opacity:.9}
  .tl-tip{
    position:fixed;z-index:40;pointer-events:none;max-width:340px;
    background:#0f2333;color:#eaf3ff;font-size:12px;line-height:1.55;
    padding:8px 10px;border-radius:8px;box-shadow:0 10px 26px rgba(16,51,80,.32);
    opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;
  }
  .tl-tip[data-on="true"]{opacity:1;transform:none}
  .tl-stage{position:relative}
  .tl-lane{
    position:relative;height:36px;border-bottom:1px dashed rgba(18,57,94,.18);
    background:
      repeating-linear-gradient(90deg,rgba(18,57,94,.055) 0 1px,transparent 1px 0);
  }
  .tl-lane:nth-child(even){background-color:rgba(240,247,255,.55)}
  .tl-lane:hover{background-color:#eef7ff}
  .tl-lane-label::before{
    content:"";display:inline-block;width:6px;height:6px;border-radius:2px;
    background:#2c5f8f;margin-right:6px;opacity:.8;vertical-align:1px;
  }
  .tl-lane-label:nth-child(2)::before{background:#2c5f8f}
  .tl-lane-label:nth-child(3)::before{background:#2f8f78}
  .tl-lane-label:nth-child(4)::before{background:#7a5fb8}
  .tl-lane-label:nth-child(5)::before{background:#b07a1d}

  .tl-grid{position:absolute;top:0;width:1px;background:rgba(18,57,94,.09);pointer-events:none;z-index:0}
  .blk{
    position:absolute;top:5px;height:26px;border-radius:7px;z-index:2;
    border:1px solid rgba(18,57,94,.55);
    background:linear-gradient(180deg,#f7c9b4,#e39a78);
    color:#43180a;font-size:11.5px;padding:0 8px;
    display:flex;align-items:center;gap:6px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 5px rgba(16,51,80,.14);
    transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease;
  }
  /* 入场动画只在第一次渲染时播放；轮询刷新再播一遍会看起来像“整个时间线闪没了” */
  #tl-stage[data-anim="1"] .blk{animation:blkIn .32s cubic-bezier(.2,.7,.3,1) both}
  @keyframes blkIn{from{opacity:0;transform:translateY(6px) scaleX(.96)}to{opacity:1;transform:none}}
  .blk:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(16,51,80,.24);border-color:#0b2740}
  .blk[data-sel="true"]{
    border-color:#0b2740;box-shadow:0 0 0 3px rgba(11,39,64,.16),0 4px 12px rgba(16,51,80,.26);
  }
  .blk[data-lane="1"]{background:linear-gradient(180deg,#bfe0f7,#8fc3e6);color:#0d3550}
  .blk[data-lane="2"]{background:linear-gradient(180deg,#c9ecdf,#93d3bd);color:#0d3d33}
  .blk[data-lane="3"]{background:linear-gradient(180deg,#dcd7f4,#b8afe4);color:#251a4d}
  .blk[data-lane="4"]{background:linear-gradient(180deg,#f3e2b9,#e2c884);color:#453005}
  .blk .dur{font-family:var(--mono);font-size:10.5px;opacity:.75;flex:0 0 auto}
  .blk[data-on="true"]::after{
    content:"";width:6px;height:6px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 2px currentColor;flex:0 0 auto;animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  .tl-now{
    position:absolute;top:0;bottom:0;width:2px;background:var(--accent);
    box-shadow:0 0 10px rgba(201,96,63,.65);pointer-events:none;z-index:3;
  }
  .tl-now::after{
    content:"现在";position:absolute;top:4px;left:4px;font-size:10px;
    color:#9b3f22;white-space:nowrap;
  }

  .tl-detail{margin-top:12px;animation:detailIn .25s ease both}
  @keyframes detailIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .tl-detail .row{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .tl-detail .title{font-size:15px;font-weight:700}
  .tl-detail .time{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-detail .text{font-size:12.5px;color:var(--muted);margin-top:4px}

  /* ── 关系边 ── */
  .edge-row{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;
    color:var(--muted);padding:7px 0;border-bottom:1px dashed rgba(18,57,94,.18);
  }
  .edge-row:last-child{border-bottom:none}

  .raw{
    font-family:var(--mono);font-size:12px;color:var(--muted);
    white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;margin:0;
  }
</style>
</head>

  <div class="main">

      </div>
      <div class="head-actions">
        <span class="chip mono" id="atg-total">—</span>
        <button class="btn" id="btn-atg-refresh">刷新</button>
      </div>

    <div class="body">
      <div id="atg-current"></div>

      <div class="card" style="margin-top:12px">
        <p class="card-title">活动轨道</p>
        <div class="tl-bar">
          <div class="seg" id="tl-window">
            <button data-win="0" data-on="true">自适应</button>
            <button data-win="1800" data-on="false">30 分</button>
            <button data-win="7200" data-on="false">2 小时</button>
            <button data-win="21600" data-on="false">6 小时</button>
            <button data-win="86400" data-on="false">24 小时</button>
          </div>
          <div class="zoom">
            <button class="btn" id="btn-zoom-out">缩小</button>
            <button class="btn" id="btn-zoom-in">放大</button>
            <button class="btn" id="btn-fit">回到现在</button>
          </div>
          <span class="hint" id="tl-hint">拖动平移 · 滚轮缩放 · 你点方块看详情</span>
        </div>

        <div class="tl-root" id="tl-root">
          <div class="tl-labels" id="tl-labels"></div>
          <div class="tl-view" id="tl-view">
            <div class="tl-ruler" id="tl-ruler"></div>
            <div class="tl-density" id="tl-density"></div>
            <div class="tl-stage" id="tl-stage"></div>
          </div>
        </div>
        <div class="tl-detail" id="tl-detail"></div>
        <div class="tl-tip" id="tl-tip"></div>
      </div>

      <div class="card">
        <p class="card-title">关系边（中断 / 恢复 / 并发 / 先后）</p>
        <div id="atg-edges"></div>
      </div>

      <div class="card">
        <p class="card-title">给模型看到的文本（serialize_timeline_text）</p>
        <pre class="raw" id="atg-text">—</pre>
      </div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const pad = (n) => String(n).padStart(2, '0');
  const fmtClock = (sec) => {
    if (!sec) return '—';
    const d = new Date(sec * 1000);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  const fmtHM = (sec) => {
    const d = new Date(sec * 1000);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const fmtDur = (s) => {
    const v = Math.max(0, Math.round(Number(s) || 0));
    if (v < 60) return `${v}s`;
    if (v < 3600) return `${Math.floor(v / 60)}m${v % 60 ? ' ' + (v % 60) + 's' : ''}`;
    return `${Math.floor(v / 3600)}h${Math.floor((v % 3600) / 60)}m`;
  };

  const state = {
    atg: null,
    t0: 0,
    t1: 0,
    selected: null,
    winPreset: 0,
    fitted: false,
    animDone: false,
  };

  async function loadAtg() {
    try {
      const r = await fetch('/api/atg?limit=80');
      const j = await r.json();
      $('#conn').dataset.live = 'true';
      $('#conn-text').textContent = '已连接';
      $('#conn-detail').textContent = location.host;
      // 单次请求出错时保留上一帧内容，不然页面会整块空掉再跳回来
      if (!j || j.error) {
        if (!state.atg) $('#atg-text').textContent = (j && j.error) || '他没起';
        return;
      }
      state.atg = j;
      renderAtg();
    } catch (e) {
      $('#conn').dataset.live = 'false';
      $('#conn-text').textContent = '他没起';
    }
  }

  function nodesOf() {
    return (state.atg && state.atg.nodes ? state.atg.nodes : []).slice()
      .filter(n => Number(n.start))
      .sort((a, b) => Number(a.start) - Number(b.start));
  }

  function nodeEnd(n) {
    const now = (state.atg && state.atg.now) || Date.now() / 1000;
    if (n.ongoing) return now;
    const e = Number(n.end) || (Number(n.start) + (Number(n.duration) || 0)) || Number(n.start);
    // 有些节点的 end 会算到未来，视图不要被它拖过去
    return Math.min(e, now);
  }

  function renderAtg() {
    const a = state.atg;
    if (!a || a.error) {
      $('#atg-current').innerHTML = '';
      $('#tl-stage').innerHTML = '';
      $('#atg-edges').innerHTML = '';
      $('#atg-text').textContent = (a && a.error) ? a.error : '他没起';
      $('#atg-total').textContent = '—';
      return;
    }
    $('#atg-total').textContent = `${a.total_nodes || 0} 节点 / ${a.total_edges || 0} 边`;
    $('#nav-atg-count').textContent = a.total_nodes || '';

    renderCurrent(a);
    if (!state.fitted) fitView(true);
    drawTimeline();
    renderEdges(a.edges || []);
    $('#atg-text').textContent = a.timeline_text || '（空）';
  }

  function renderCurrent(a) {
    const cur = $('#atg-current');
    cur.innerHTML = '';
    if (!a.current) {
      const box = el('div', 'card');
      box.appendChild(el('p', 'card-title', '当前活动'));
      box.appendChild(el('div', 'muted', '没有进行中的活动（桌面静止或刚启动）'));
      cur.appendChild(box);
      return;
    }
    const box = el('div', 'current-activity');
    const left = el('div');
    left.appendChild(el('div', 'desc', a.current.desc || '（空）'));
    const meta = el('div', 'meta');
    if (a.current.task) meta.appendChild(el('span', '', `任务层：${a.current.task}`));
    meta.appendChild(el('span', 'mono', `已持续 ${fmtDur(a.current.duration)}`));
    meta.appendChild(el('span', 'mono', `置信 ${Math.round((a.current.confidence || 0) * 100)}%`));
    meta.appendChild(el('span', 'chip', `来源 ${a.current.source || '—'}`));
    left.appendChild(meta);
    box.appendChild(left);
    cur.appendChild(box);
  }

  // ── 视图 ──
  function viewWidth() {
    const v = $('#tl-view');
    return Math.max(1, v.clientWidth);
  }

  function fitView(reset) {
    const nodes = nodesOf();
    const now = (state.atg && state.atg.now) || Date.now() / 1000;
    if (!nodes.length) {
      state.t0 = now - 1800;
      state.t1 = now;
      state.fitted = true;
      return;
    }
    const start = Math.min(...nodes.map(n => Number(n.start)));
    const end = Math.max(now, ...nodes.map(nodeEnd));
    let span = Math.max(300, end - start);
    span *= 1.12;
    if (state.winPreset) span = state.winPreset;
    state.t0 = end - span;
    state.t1 = end;
    state.fitted = true;
  }

  function drawTimeline() {
    const nodes = nodesOf();
    const now = (state.atg && state.atg.now) || Date.now() / 1000;
    const W = viewWidth();
    const span = Math.max(1, state.t1 - state.t0);

    // 轨道动态分配：区间重叠就往上叠一层（像剪辑里多条 track）
    const lanes = [];
    const placed = [];
    for (const n of nodes) {
      const s = Number(n.start);
      const e = Math.max(s + 1, nodeEnd(n));
      let idx = lanes.findIndex(v => v <= s);
      if (idx === -1) { idx = lanes.length; }
      lanes[idx] = e;
      placed.push({ n, lane: idx, s, e });
    }
    const laneCount = Math.max(1, lanes.length);

    // 左边标签列
    const labels = $('#tl-labels');
    labels.innerHTML = '';
    labels.appendChild(el('div', 'tl-label-ruler'));
    for (let i = 0; i < laneCount; i++) {
      labels.appendChild(el('div', 'tl-lane-label', `轨道 ${i + 1}`));
    }

    // 刻度
    const ruler = $('#tl-ruler');
    ruler.innerHTML = '';
    const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200];
    const step = steps.find(s => (s / span) * W >= 74) || 86400;
    const first = Math.ceil(state.t0 / step) * step;
    for (let t = first; t <= state.t1; t += step) {
      const x = ((t - state.t0) / span) * W;
      const tick = el('div', 'tl-tick');
      tick.style.left = `${x}px`;
      ruler.appendChild(tick);
      const lab = el('div', 'tl-tick-label', step >= 3600 ? fmtHM(t) : fmtClock(t).slice(0, 5));
      lab.style.left = `${x}px`;
      ruler.appendChild(lab);
    }
    const nowX = ((now - state.t0) / span) * W;
    if (nowX >= 0 && nowX <= W) {
      const nl = el('div', 'tl-now');
      nl.style.left = `${nowX}px`;
      ruler.appendChild(nl);
    }

    renderDensity(placed, span, W, state.t0);

    // 舞台
    const stage = $('#tl-stage');
    stage.innerHTML = '';
    stage.dataset.anim = state.animDone ? '0' : '1';
    stage.style.height = `${laneCount * 36}px`;
    for (let i = 0; i < laneCount; i++) stage.appendChild(el('div', 'tl-lane'));

    // 竖向网格线：跟刻度对齐，横跨所有轨道
    for (let t = first; t <= state.t1; t += step) {
      const x = ((t - state.t0) / span) * W;
      const g = el('div', 'tl-grid');
      g.style.left = `${x}px`;
      g.style.height = `${laneCount * 36}px`;
      stage.appendChild(g);
    }

    const laneEls = stage.querySelectorAll('.tl-lane');
    for (const p of placed) {
      const { n, lane, s, e } = p;
      const x0 = ((s - state.t0) / span) * W;
      const x1 = ((e - state.t0) / span) * W;
      if (x1 < -40 || x0 > W + 40) continue;
      const left = Math.max(-2, x0);
      const width = Math.max(10, Math.min(W + 2, x1) - left);

      const b = el('div', 'blk');
      b.dataset.lane = String(lane % 4);
      b.dataset.on = String(!!n.ongoing);
      b.dataset.sel = String(!!(state.selected && state.selected.id === n.id));
      b.style.left = `${left}px`;
      b.style.width = `${width}px`;
      const durS = Math.max(1, e - s);
      b.addEventListener('mouseenter', (ev) => tipShow(n, durS, ev));
      b.addEventListener('mousemove', (ev) => tipShow(n, durS, ev));
      b.addEventListener('mouseleave', tipHide);
      // 太窄的块只显示色块，硬塞文字会变成竖排
      if (width >= 54) {
        b.appendChild(el('span', '', n.desc || '（空）'));
        b.appendChild(el('span', 'dur', fmtDur(durS)));
      }
      b.addEventListener('click', (ev) => {
        ev.stopPropagation();
        state.selected = n;
        drawTimeline();
        renderDetail(n);
      });
      laneEls[lane].appendChild(b);
    }
    if (!placed.length) {
      stage.appendChild(el('div', 'empty', '这段时间没有活动，缩放或拖回去看看'));
    }
    state.animDone = true;
    drawNowOverlay(now, span, W, laneCount);
  }

  // 密度条：每个像素桶里有多少活动重叠（像 GitHub 的贡献热力，但按时间）
  function renderDensity(placed, span, W, t0) {
    const box = $('#tl-density');
    box.innerHTML = '';
    const cols = Math.max(40, Math.min(240, Math.floor(W / 6)));
    const bucket = span / cols;
    const counts = new Array(cols).fill(0);
    for (const p of placed) {
      const a = Math.max(t0, p.s);
      const b = Math.min(t0 + span, p.e);
      if (b <= a) continue;
      const i0 = Math.max(0, Math.floor((a - t0) / bucket));
      const i1 = Math.min(cols - 1, Math.floor((b - t0) / bucket));
      for (let i = i0; i <= i1; i++) counts[i] += 1;
    }
    const max = Math.max(1, ...counts);
    const w = W / cols;
    for (let i = 0; i < cols; i++) {
      if (!counts[i]) continue;
      const bar = el('i');
      bar.style.left = `${i * w}px`;
      bar.style.width = `${Math.max(1, w - 0.5)}px`;
      const t = counts[i] / max;
      bar.style.background = t > 0.66 ? '#c9603f' : (t > 0.33 ? '#2c5f8f' : '#7fa8cc');
      bar.style.opacity = String(0.35 + 0.55 * t);
      box.appendChild(bar);
    }
  }

  function tipShow(n, durS, ev) {
    const tip = $('#tl-tip');
    tip.textContent = `${fmtClock(n.start)} → ${n.ongoing ? '进行中' : fmtClock(nodeEnd(n))} · ${fmtDur(durS)}\n${n.desc || ''}${n.snapshot ? '\n' + n.snapshot : ''}`;
    tip.style.left = `${Math.min(window.innerWidth - 370, ev.clientX + 14)}px`;
    tip.style.top = `${Math.min(window.innerHeight - 130, ev.clientY + 16)}px`;
    tip.dataset.on = 'true';
  }
  function tipHide() { $('#tl-tip').dataset.on = 'false'; }

  function drawNowOverlay(now, span, W, laneCount) {
    const x = ((now - state.t0) / span) * W;
    if (x < 0 || x > W) return;
    const stage = $('#tl-stage');
    const line = el('div', 'tl-now');
    line.style.left = `${x}px`;
    line.style.height = `${laneCount * 36}px`;
    stage.appendChild(line);
  }

  function renderDetail(n) {
    const box = $('#tl-detail');
    box.innerHTML = '';
    const row = el('div', 'row');
    row.appendChild(el('div', 'title', n.desc || '（空）'));
    row.appendChild(el('div', 'time', `${fmtClock(n.start)} → ${n.ongoing ? '进行中' : fmtClock(nodeEnd(n))} · ${fmtDur(n.duration)}`));
    if (n.status) row.appendChild(el('span', 'chip', n.status));
    if (n.source) row.appendChild(el('span', 'chip', `来源 ${n.source}`));
    box.appendChild(row);
    if (n.snapshot) box.appendChild(el('div', 'text', n.snapshot));
    if (n.entities && n.entities.length) {
      const m = el('div', 'row');
      m.style.marginTop = '6px';
      for (const e of n.entities.slice(0, 8)) m.appendChild(el('span', 'chip', e));
      box.appendChild(m);
    }
  }

  function renderEdges(edges) {
    const box = $('#atg-edges');
    box.innerHTML = '';
    const list = edges.slice(-40).reverse();
    if (!list.length) box.appendChild(el('div', 'empty', '还没有边'));
    for (const e of list) {
      const row = el('div', 'edge-row');
      row.appendChild(el('span', 'mono', e.from));
      row.appendChild(el('span', 'faint', '→'));
      row.appendChild(el('span', 'mono', e.to));
      row.appendChild(el('span', 'chip', e.type || 'edge'));
      if (e.note) row.appendChild(el('span', 'faint', e.note));
      box.appendChild(row);
    }
  }

  // ── 交互：拖动 / 缩放 ──
  function panByPx(dx) {
    const span = state.t1 - state.t0;
    const dt = (dx / viewWidth()) * span;
    state.t0 -= dt;
    state.t1 -= dt;
  }

  function zoomAt(factor, anchorX) {
    const span = state.t1 - state.t0;
    const W = viewWidth();
    const anchor = state.t0 + (anchorX / W) * span;
    const newSpan = Math.min(86400 * 3, Math.max(20, span * factor));
    const ratio = (anchorX / W);
    state.t0 = anchor - newSpan * ratio;
    state.t1 = state.t0 + newSpan;
    // 不允许跑到未来太远
    const now = (state.atg && state.atg.now) || Date.now() / 1000;
    if (state.t1 > now + newSpan * 0.2) {
      state.t1 = now + newSpan * 0.2;
      state.t0 = state.t1 - newSpan;
    }
  }

  let drag = null;
  const view = $('#tl-view');
  view.addEventListener('mousedown', (e) => {
    if (e.target.closest('.blk')) return;
    drag = { x: e.clientX };
    view.dataset.grab = 'true';
  });
  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    drag.x = e.clientX;
    panByPx(dx);
    drawTimeline();
  });
  window.addEventListener('mouseup', () => {
    if (drag) { drag = null; view.dataset.grab = 'false'; }
  });
  view.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = view.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (e.shiftKey) {
      panByPx(e.deltaY > 0 ? 60 : -60);
    } else {
      zoomAt(e.deltaY > 0 ? 1.18 : 0.85, x);
    }
    drawTimeline();
  }, { passive: false });

  $('#btn-zoom-in').addEventListener('click', () => { zoomAt(0.8, viewWidth() / 2); drawTimeline(); });
  $('#btn-zoom-out').addEventListener('click', () => { zoomAt(1.25, viewWidth() / 2); drawTimeline(); });
  $('#btn-fit').addEventListener('click', () => {
    const now = (state.atg && state.atg.now) || Date.now() / 1000;
    const span = state.t1 - state.t0;
    state.t1 = now + span * 0.08;
    state.t0 = state.t1 - span;
    drawTimeline();
  });

  $('#tl-window').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-win]');
    if (!b) return;
    state.winPreset = Number(b.dataset.win);
    for (const x of $('#tl-window').querySelectorAll('button')) x.dataset.on = String(x === b);
    fitView(true);
    drawTimeline();
  });

  $('#btn-atg-refresh').addEventListener('click', loadAtg);
  window.addEventListener('resize', () => { if (state.atg) drawTimeline(); });

  loadAtg();
  setInterval(loadAtg, 5000);
})();
</script>



</body></html>
